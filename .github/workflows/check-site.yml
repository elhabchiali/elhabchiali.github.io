name: Check portfolio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/build_site.py
      - run: git diff --exit-code -- '*.html' '*.svg' sitemap.xml robots.txt
      - run: python scripts/check_site.py
      - run: node --check lab.js && node --check filter-core.js && node scripts/test_filters.js
